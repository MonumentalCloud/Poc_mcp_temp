# fly.io config — deploy with: fly launch --copy-config --now  (or fly deploy)
# MCP endpoint: https://<app>.fly.dev/mcp   health: /health
app = "monimo-poc-mcp"      # 전역 유니크 — 이미 사용 중이면 변경
primary_region = "nrt"      # Tokyo (한국에서 가장 가까운 리전)

[build]
# uses ./Dockerfile

[env]
PORT = "8000"
FASTMCP_HTTP_HOST_ORIGIN_PROTECTION = "false"
# Weaviate + Qwen 임베딩으로 전환하려면 (README 'VDB' 참조):
#   1) fly secrets set QWEN_API_KEY=... WEAVIATE_URL=... WEAVIATE_API_KEY=...
#   2) 아래 두 줄 주석 해제 후 재배포 (적재는 scripts/build_vdb.py --backend weaviate)
# VDB_BACKEND = "weaviate"
# EMBEDDER = "qwen_api"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"   # 유휴 시 머신 정지 (요청 오면 ~1초 내 자동 기동)
auto_start_machines = true
min_machines_running = 0      # 데모 중 콜드스타트도 없애려면 1로

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
