name: Fly Deploy

on:
  push:
    branches: [claude/mcp-mock-tools-skill-vdb-ovcsi2, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app if missing
        run: flyctl apps create monimo-poc-mcp --org personal || true
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
